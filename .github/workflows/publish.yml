# A tag v* publishes @isaacchacko/basalt to npm. npm trusts this workflow
# (trusted publishing, set up on npmjs.com), so there's no token and no
# passkey, and the release carries provenance from the commit it was built from.
#
#   npm version patch && git push --follow-tags

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: The tag is the package's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
      # what's built with Basalt (the garden, isaacchacko.com, design) builds
      # again with this release, once npm serves it: each Vercel project's
      # deploy hook, one a line, in the CONSUMER_DEPLOY_HOOKS secret
      - name: What's built with Basalt deploys again
        env:
          HOOKS: ${{ secrets.CONSUMER_DEPLOY_HOOKS }}
        run: |
          version=$(node -p 'require("./package.json").version')
          for i in $(seq 60); do
            [ "$(npm view @isaacchacko/basalt@latest version --prefer-online 2>/dev/null)" = "$version" ] && break
            sleep 10
          done
          for hook in $HOOKS; do curl -fsS -X POST "$hook" > /dev/null && echo "one deploying again"; done
